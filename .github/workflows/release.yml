name: Release

# v1.2.3 형태의 태그를 푸시하면:
#   1. Docker Hub 에 이미지 push (latest + 버전 태그)
#   2. npm 에 SDK(@datasee/lookout)·CLI(@datasee/lookout-cli) publish —
#      Trusted Publishing(OIDC), 토큰 없음.
#      공개되려면 npmjs.com 에서 사람이 승인해야 한다.
#   3. GitHub Release 생성
#
# 필요한 저장소 시크릿: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        # v1.2.3 → 1.2.3 (이미지 태그는 v 없이 — secret-vault 와 같은 형식)
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            datamaker/lookout:latest
            datamaker/lookout:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing — 토큰 대신 OIDC 로 신원을 증명한다.
      # npmjs.com 의 **패키지마다** Trusted Publisher 를 등록해야 한다
      # (datamaker / lookout / release.yml). Allowed actions 는 스테이징만 켠다.
      id-token: write
    strategy:
      # 한쪽이 실패해도 다른 쪽은 올라가게 둔다.
      fail-fast: false
      matrix:
        include:
          - pkg: '@datasee/lookout'      # 앱이 import 하는 SDK
            dir: sdk
          - pkg: '@datasee/lookout-cli'  # CLI
            dir: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing 은 npm 11.5.1+, Node 22.14+ 가 필요하다.
      # 러너 이미지에 끌려다니지 않게 못박는다.
      - run: npm i -g npm@^11.5.1
      - run: npm ci
      - name: Build ${{ matrix.pkg }}
        run: npm run build -w ${{ matrix.pkg }}
      # npmjs.com 의 trusted publisher 에서 "Allow npm publish" 를 켜 두었으므로
      # 승인 단계 없이 바로 공개된다. 사람이 막아 주는 단계가 없으니, 이 워크플로를
      # 돌릴 수 있는 사람은 곧 npm 에 배포할 수 있는 사람이다.
      - name: Publish ${{ matrix.pkg }}
        working-directory: ${{ matrix.dir }}
        run: |
          npm --version
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view ${{ matrix.pkg }} version 2>/dev/null || echo none)
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "${{ matrix.pkg }}@$LOCAL 는 이미 올라가 있습니다 — 건너뜁니다."
          else
            npm publish --access public
            echo "::notice::${{ matrix.pkg }}@$LOCAL 를 발행했습니다."
          fi

  release:
    runs-on: ubuntu-latest
    needs: [docker, npm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
