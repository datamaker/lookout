# Easy installation using the pre-built Docker Hub image (no build step).
#
# Usage:
#   docker compose -f docker-compose.hub.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: lookout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lookout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lookout}
      POSTGRES_DB: lookout
    volumes:
      - lookout-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lookout']
      interval: 5s
      timeout: 3s
      retries: 10

  lookout:
    image: datamaker/lookout:latest
    container_name: lookout
    restart: unless-stopped
    ports:
      - '${PORT:-9000}:9000'
    environment:
      DATABASE_URL: postgres://lookout:${POSTGRES_PASSWORD:-lookout}@postgres:5432/lookout
      LOOKOUT_PUBLIC_URL: ${LOOKOUT_PUBLIC_URL:-}
      LOOKOUT_RETENTION_DAYS: ${LOOKOUT_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lookout-pgdata:
